
name: Build NIREXION GLASS X APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: unzip -q NirexionGlassX-edited.zip

      - name: Verify Android project
        run: |
          test -f NirexionGlassX/settings.gradle.kts
          test -f NirexionGlassX/app/build.gradle.kts

      - name: Build debug APK
        working-directory: NirexionGlassX
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIREXION-GLASS-X-debug-apk
          path: NirexionGlassX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
